<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
    <h2>Job Application</h2>
    <br>
    <label for="name">Name</label>
    <br>
    <input type="text" id="name">
    <br>
    <label for="Email1">Email</label>
    <br>
    <input type="email" id="Email1">
    <br>
    <label for="phone">Phone</label>
    <br>
    <input type="tel" id="phone">
    <br>
    <label for="file1">Resume:</label>
    <input type="file" id="file1" alt="no file choosen">
    <br>
    <label for="yr">Experience(years):</label>
    <br>
    <input type="number" name="counter" id="yr" min="0" max="50">
    <fieldset>
        <legend>Skills:</legend>
        <br>
        <label for="skill1">html</label>
        <br>
        <input type="checkbox" id="skill1">
        <br>
        <label for="skill2">CSS</label>
        <br>
        <input type="checkbox" id="skill2">
        <br>
        <label for="skill3">JavaScript</label>
        <br>
        <input type="checkbox" id="skill3">
    </fieldset>
<br>
    <label for="edu">Higest Education:</label>
    <br>
    <select name="education" id="edu">
        <option value="High School">High School</option>
        <option value="12th">12th</option>
        <option value="Graduation">Graduation</option>
    </select>
<br>
<fieldset>
    <legend>Availability</legend>
<label for="fulltime">Full-time</label>
<br>
 <input type="radio" name="radio" id="fulltime">
 <br>
 <label for="parttime">Part-time</label>
 <br>
 <input type="radio"name="radio" id="parttime">
 <br>
</fieldset>
<br>
<br>
 <label for="comments">Additional Comments:</label>
 <br>
 <textArea name="textArea" id="comments" rows="10" cols="15">

 </textArea>
 <input type="submit" value="Submit Application">
</form>
</body>
</html>
